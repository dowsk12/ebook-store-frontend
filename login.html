<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrar — BookVerse</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card card">
      <div class="auth-brand"><img src="assets/icons/logo.svg" alt="logo" class="logo"><h2>BookVerse</h2></div>
      <p class="muted">Acesse sua conta para ver histórico e finalizar compras.</p>

      <input id="name" placeholder="Nome completo (para registrar)" />
      <input id="email" placeholder="Email" type="email" />
      <input id="password" placeholder="Senha" type="password" />

      <div class="row">
        <button id="btnRegister" class="btn outline">Registrar</button>
        <button id="btnLogin" class="btn primary">Entrar</button>
      </div>

      <p class="muted small">Os dados ficam armazenados no seu navegador (LocalStorage). Para testes, use qualquer email.</p>
    </section>
  </main>

  <script type="module" src="scripts/auth.js"></script>
</body>
</html>
